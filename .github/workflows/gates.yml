name: gates

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to revalidate and publish
        required: true
        type: string

permissions:
  contents: read

env:
  # The main-branch retry runs the corrected workflow against the same
  # immutable tag. Later retries can be started from the Actions UI.
  PF_TEST_REF: ${{ (inputs.release_tag && format('refs/tags/{0}', inputs.release_tag)) || (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Retry v1.3.7 with explicit runner dependencies' && 'refs/tags/v1.3.7') || (github.ref_type == 'tag' && github.ref) || github.sha }}

jobs:
  fast:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PF_TEST_REF }}
      - name: install deps
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: shellcheck -S warning pseudoforge psmaker install.sh lib/*.sh tools/*.sh tests/*.sh deploy/scripts/*.sh
      - name: anchors
        run: python3 tools/check-anchors.py
      - name: reference tables
        run: tools/gen_reference.sh --check

  interfaces:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PF_TEST_REF }}
      - name: install deps
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: audit-interfaces
        run: tools/audit-interfaces.sh
      - name: audit
        run: PF_AUDIT_OUTPUT_DIR="$RUNNER_TEMP/pf-audit" tools/audit.sh

  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PF_TEST_REF }}
      - name: install deps
        run: sudo apt-get update && sudo apt-get install -y shellcheck python3-venv gfortran liblapack-dev libblas-dev unzip
      - name: run_tests
        run: |
          set +e
          ./tests/run_tests.sh --all 2>&1 | tee "$RUNNER_TEMP/pf-tests.log"
          result=${PIPESTATUS[0]}
          set -e
          sed -E 's/\x1B\[[0-9;]*[mK]//g' "$RUNNER_TEMP/pf-tests.log" > "$RUNNER_TEMP/pf-tests-plain.log"
          python3 - "$RUNNER_TEMP/pf-tests-plain.log" <<'PY'
          import pathlib, re, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          for line in lines:
              if re.match(r"^\s*FAIL\s", line):
                  print("::error title=Test failure::" + line.strip().replace("%", "%25"))
              elif re.fullmatch(r"\d+ passed, \d+ failed, \d+ skipped", line):
                  summary = line
          if "summary" in globals():
              print("::notice title=Full test suite::" + summary)
          PY
          exit "$result"

  publish:
    if: github.ref_type == 'tag' || inputs.release_tag != '' || (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Retry v1.3.7 with explicit runner dependencies')
    needs: [fast, interfaces, tests]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PF_TEST_REF }}
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PF_TAG=${PF_TEST_REF#refs/tags/}
          version=${PF_TAG#v}
          [[ "$PF_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin "$PF_TEST_REF"
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse 'FETCH_HEAD^{commit}')" ]]
          [[ "$(./pseudoforge version | head -n 1)" == "PseudoForge $version --"* ]]
          awk -v version="$version" '
            $1 == "##" && found {exit}
            $1 == "##" && $2 == "Version" && $3 == version {found=1; next}
            found {print}
            END {if (!found) exit 1}
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$PF_TAG" >/dev/null 2>&1; then exit 0; fi
          gh release create "$PF_TAG" --verify-tag --title "PseudoForge $PF_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
