<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documentation Search — PseudoForge</title>
<meta name="description" content="Full-text documentation search across PseudoForge reference, guides, and tutorials.">
<script>
(function () {
  try {
    var s = localStorage.getItem('pf-theme');
    document.documentElement.dataset.theme = (s === 'dark' || s === 'light') ? s : 'light';
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
})();
</script>
<link rel="stylesheet" href="/css/main.css?v=143">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#4051b5">
<style>
.search-container {
  max-width: 800px;
  margin: 0 auto;
}
.search-input-wrap {
  display: flex;
  gap: 0.75rem;
  margin-bottom: 1.5rem;
}
.search-input-wrap input {
  flex: 1;
  padding: 0.75rem 1rem;
  font-size: 1.05rem;
  border: 1px solid var(--input-border);
  border-radius: 6px;
  background: var(--input-bg);
  color: var(--fg-strong);
}
.search-input-wrap input:focus {
  outline: none;
  border-color: var(--accent);
}
.search-stats {
  font-size: 0.88rem;
  color: var(--muted);
  margin-bottom: 1.25rem;
}
.search-results {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}
.search-item {
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  padding: 1.15rem 1.35rem;
}
.search-item h3 {
  margin: 0 0 0.35rem 0;
  font-size: 1.1rem;
}
.search-item a {
  color: var(--accent);
  text-decoration: none;
}
.search-item a:hover {
  text-decoration: underline;
}
.search-item-location {
  font-size: 0.8rem;
  color: var(--muted);
  margin-bottom: 0.5rem;
  font-family: var(--mono);
}
.search-item-snippet {
  font-size: 0.92rem;
  color: var(--fg);
  line-height: 1.5;
}
.search-item-snippet mark {
  background: #fef08a;
  color: #854d0e;
  padding: 0.1rem 0.25rem;
  border-radius: 3px;
  font-weight: 600;
}
.search-notice {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 1.5rem;
  color: var(--muted);
  text-align: center;
}
</style>
</head>
<body>

<header class="site">
  <a class="brand" href="/">Pseudo<strong>Forge</strong></a>
  <nav>
    <a href="/">Generate</a>
    <a href="/advise/">Advise</a>
    <a href="/compare/">Compare</a>
    <a href="/cutoff/">Cutoff</a>
    <a href="/playground/">Playground</a>
    <a href="/download/">Download</a>
    <a href="/validate/">Validate</a>
    <a href="/docs/">Docs</a>
    <a href="/about/">About</a>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch colour theme">
      <span class="theme-icon theme-icon-dark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10m0-5 2.39 3.42C13.65 5.15 12.84 5 12 5s-1.65.15-2.39.42zM3.34 7l4.16-.35A7.2 7.2 0 0 0 5.94 8.5c-.44.74-.69 1.5-.83 2.29zm.02 10 1.76-3.77a7.131 7.131 0 0 0 2.38 4.14zM20.65 7l-1.77 3.79a7.02 7.02 0 0 0-2.38-4.15zm-.01 10-4.14.36c.59-.51 1.12-1.14 1.54-1.86.42-.73.69-1.5.83-2.29zM12 22l-2.41-3.44c.74.27 1.55.44 2.41.44.82 0 1.63-.17 2.37-.44z"/></svg>
      </span>
      <span class="theme-icon theme-icon-light" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="m17.75 4.09-2.53 1.94.91 3.06-2.63-1.81-2.63 1.81.91-3.06-2.53-1.94L12.44 4l1.06-3 1.06 3zm3.5 6.91-1.64 1.25.59 1.98-1.7-1.17-1.7 1.17.59-1.98L15.75 11l2.06-.05L18.5 9l.69 1.95zm-2.28 4.95c.83-.08 1.72 1.1 1.19 1.85-.32.45-.66.87-1.08 1.27C15.17 23 8.84 23 4.94 19.07c-3.91-3.9-3.91-10.24 0-14.14.4-.4.82-.76 1.27-1.08.75-.53 1.93.36 1.85 1.19-.27 2.86.69 5.83 2.89 8.02a9.96 9.96 0 0 0 8.02 2.89m-1.64 2.02a12.08 12.08 0 0 1-7.8-3.47c-2.17-2.19-3.33-5-3.49-7.82-2.81 3.14-2.7 7.96.31 10.98 3.02 3.01 7.84 3.12 10.98.31"/></svg>
      </span>
    </button>
  </nav>
</header>

<main>

<div class="search-container">
  <section class="intro">
    <h1>Documentation Search</h1>
    <p>
      Client-side full-text search across the entire PseudoForge documentation.
    </p>
  </section>

  <div class="search-input-wrap">
    <input type="search" id="search-query" placeholder="Search documentation (e.g. cutoffs, oncvpsp, phonons, UPF v2)..." autofocus spellcheck="false">
    <button type="button" class="btn primary" id="btn-search">Search</button>
  </div>

  <div class="search-stats" id="search-stats"></div>
  <div class="search-results" id="search-results"></div>
  <div class="search-notice" id="search-notice" hidden></div>
</div>

</main>

<footer class="site">
  <p>
    GPL-2.0-or-later ·
    <a href="/docs/">Documentation</a> ·
    <a href="/about/">Citation and licence</a> ·
    <a href="https://github.com/MHAmirkhani/pseudoforge">Source</a>
  </p>
</footer>

<script src="/js/api.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/search.js"></script>
</body>
</html>
