<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elements — PseudoForge</title>
<meta name="description" content="Explore pseudopotential files and profiles available per element.">
<script>
(function () {
  try {
    var s = localStorage.getItem('pf-theme');
    document.documentElement.dataset.theme = (s === 'dark' || s === 'light') ? s : 'light';
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
})();
</script>
<link rel="stylesheet" href="/css/main.css?v=143">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#4051b5">
<style>
.el-lookup {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1.5rem;
}
.el-lookup input {
  flex: 1;
  padding: 0.5rem 0.75rem;
  font-size: 0.95rem;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--card);
  color: var(--fg);
}
.el-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 1.5rem;
  margin-top: 1rem;
}
.el-card h2 {
  margin-top: 0;
  margin-bottom: 0.5rem;
  font-size: 1.25rem;
  color: var(--fg-strong);
}
.el-family-section {
  margin-top: 1.5rem;
}
.el-family-title {
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 0.75rem;
  border-bottom: 1px solid var(--line);
  padding-bottom: 0.35rem;
}
.el-table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 1rem;
}
.el-table th, .el-table td {
  padding: 0.45rem 0.6rem;
  text-align: left;
  border-bottom: 1px solid var(--line);
  font-size: 0.88rem;
}
.el-table th {
  color: var(--muted);
  font-weight: 500;
}
.el-unavail-box {
  margin-top: 2rem;
  background: var(--bg);
  border: 1px solid var(--line);
  border-left: 4px solid #f59e0b;
  border-radius: 6px;
  padding: 1rem 1.25rem;
}
.el-unavail-box h3 {
  margin-top: 0;
  margin-bottom: 0.75rem;
  font-size: 1rem;
  color: #f59e0b;
}
.el-unavail-item {
  margin-bottom: 0.85rem;
}
.el-unavail-label {
  font-size: 0.88rem;
  font-weight: 500;
  margin-bottom: 0.25rem;
}
.el-cmd-box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0.4rem 0.6rem;
  font-family: var(--mono);
  font-size: 0.82rem;
  overflow-x: auto;
  white-space: nowrap;
}
.el-error {
  padding: 1rem 1.25rem;
  background: var(--card);
  border: 1px solid #ef4444;
  border-radius: 6px;
  color: #ef4444;
  margin-top: 1rem;
}
</style>
</head>
<body>

<header class="site">
  <a class="brand" href="/">Pseudo<strong>Forge</strong></a>
  <nav>
    <a href="/">Generate</a>
    <a href="/advise/">Advise</a>
    <a href="/download/">Download</a>
    <a href="/provenance/">Provenance</a>
    <a href="/elements/" class="active">Elements</a>
    <a href="/validate/">Validate</a>
    <a href="/docs/">Docs</a>
    <a href="/about/">About</a>
    <button type="button" class="theme-toggle" id="theme-toggle"
            aria-label="Switch colour theme">
      <span class="theme-icon theme-icon-dark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10m0-5 2.39 3.42C13.65 5.15 12.84 5 12 5s-1.65.15-2.39.42zM3.34 7l4.16-.35A7.2 7.2 0 0 0 5.94 8.5c-.44.74-.69 1.5-.83 2.29zm.02 10 1.76-3.77a7.131 7.131 0 0 0 2.38 4.14zM20.65 7l-1.77 3.79a7.02 7.02 0 0 0-2.38-4.15zm-.01 10-4.14.36c.59-.51 1.12-1.14 1.54-1.86.42-.73.69-1.5.83-2.29zM12 22l-2.41-3.44c.74.27 1.55.44 2.41.44.82 0 1.63-.17 2.37-.44z"/></svg>
      </span>
      <span class="theme-icon theme-icon-light" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="m17.75 4.09-2.53 1.94.91 3.06-2.63-1.81-2.63 1.81.91-3.06-2.53-1.94L12.44 4l1.06-3 1.06 3zm3.5 6.91-1.64 1.25.59 1.98-1.7-1.17-1.7 1.17.59-1.98L15.75 11l2.06-.05L18.5 9l.69 1.95zm-2.28 4.95c.83-.08 1.72 1.1 1.19 1.85-.32.45-.66.87-1.08 1.27C15.17 23 8.84 23 4.94 19.07c-3.91-3.9-3.91-10.24 0-14.14.4-.4.82-.76 1.27-1.08.75-.53 1.93.36 1.85 1.19-.27 2.86.69 5.83 2.89 8.02a9.96 9.96 0 0 0 8.02 2.89m-1.64 2.02a12.08 12.08 0 0 1-7.8-3.47c-2.17-2.19-3.33-5-3.49-7.82-2.81 3.14-2.7 7.96.31 10.98 3.02 3.01 7.84 3.12 10.98.31"/></svg>
      </span>
    </button>
  </nav>
</header>

<main>

<section class="intro">
  <h1>Element Explorer</h1>
  <p class="lede">
    List everything the store has for an element: every native file grouped by family and functional,
    with sizes, engines, and commands to generate missing sets.
  </p>
</section>

<section class="panel">
  <form id="el-form" class="el-lookup">
    <input type="text" id="el-input" placeholder="Element symbol (e.g. Si, Fe, Au)" autocomplete="off">
    <button type="submit" class="btn primary">Lookup Element</button>
  </form>

  <div id="el-result"></div>
</section>

</main>

<footer class="site">
  <p>GPL-2.0-or-later ·
     <a href="/docs/">Documentation</a> ·
     <a href="https://github.com/MHAmirkhani/pseudoforge">Source</a></p>
</footer>

<script src="/js/api.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/elements.js"></script>
</body>
</html>
