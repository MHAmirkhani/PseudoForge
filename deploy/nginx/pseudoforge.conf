# ---------------------------------------------------------------------------
# PseudoForge -- one domain, four things behind it.
#
#   /          the frontend, static
#   /docs/     the MkDocs site, static
#   /api/      the transport, proxied to uvicorn on 127.0.0.1
#   /library/  the native-file mirror, static
#
# Order matters. The most specific locations come first, and `/` is last,
# because `location /` matches everything and Nginx's prefix matching would
# otherwise swallow /docs/ and /api/.
#
# Copy to /etc/nginx/sites-available/, symlink into sites-enabled/, and put
# the real server_name in deploy/local/ rather than here.
# ---------------------------------------------------------------------------

upstream pseudoforge_api {
    server 127.0.0.1:8099;
    keepalive 4;
}

# One core. Being generous with concurrency would just queue.
limit_req_zone $binary_remote_addr zone=pfapi:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name  PSEUDOFORGE_DOMAIN;   # replaced by deploy/scripts/install-vps.sh

    root /var/lib/pseudoforge/www;
    index index.html;

    client_max_body_size 8m;           # matches PF_MAX_UPLOAD in the service

    access_log /var/log/nginx/pseudoforge.access.log;
    error_log  /var/log/nginx/pseudoforge.error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    # ---- the API ---------------------------------------------------------
    location /api/ {
        limit_req zone=pfapi burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://pseudoforge_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # A conversion on one core is slow, not hung.
        proxy_read_timeout 120s;
    }

    # ---- the documentation ----------------------------------------------
    location /docs/ {
        alias /var/lib/pseudoforge/docs/;
        index index.html;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # ---- the native-file mirror -----------------------------------------
    location /library/ {
        alias /var/lib/pseudoforge/native/;
        autoindex on;
        autoindex_exact_size off;
        add_header Content-Disposition "attachment";
    }

    # ---- the frontend ----------------------------------------------------
    # Last, because it matches everything.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
